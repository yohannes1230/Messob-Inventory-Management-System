components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginInput:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: Admin@123456
    CreateUserInput:
      type: object
      required:
        - username
        - email
        - password
        - roles
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        employeeRef:
          type: string
        roles:
          type: array
          items:
            type: object
            required:
              - role
              - scopeType
            properties:
              role:
                type: string
              scopeType:
                type: string
                enum:
                  - global
                  - branch
