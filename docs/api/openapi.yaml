openapi: 3.0.3
info:
  title: Addis Mesob Property Management System (AM-PMS) API
  version: 1.0.0
  description: Backend API for AM-PMS. Phase 1 implements Auth, RBAC, User Management, Role Management, and Append-Only Audit Logging.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development server
tags:
  - name: Auth
    description: Authentication, session management, MFA, and password controls
  - name: Users
    description: Administrative user account management
  - name: Roles
    description: Role-based access control definitions
  - name: Audit Logs
    description: Query append-only audit trail
  - name: Health
    description: Service availability check
  - name: Master Data - Branches
    description: Branch management
  - name: Master Data - Buildings
    description: Building management
  - name: Master Data - Floors
    description: Floor management
  - name: Master Data - Rooms
    description: Room management
  - name: Master Data - Departments
    description: Department management
  - name: Master Data - Categories
    description: Category taxonomy management
  - name: Master Data - Property Types
    description: Property Type management
  - name: Master Data - Status Flows
    description: Lifecycle status and state transition management
  - name: Master Data - Request Types
    description: Request type classification
  - name: Master Data - Suppliers
    description: Supplier and vendor master data management (FR-REG-06)
  - name: Custom Fields
    description: Dynamic custom field schema and validation engine
  - name: Assets
    description: Asset registration, auto-coding, QR generation, photo attachments, and bulk import (FR-REG-01 through 06)
  - name: Assignments
    description: Custody allocation, acceptance, return, transfer, and chronological timeline history (FR-ASG-01 through 06)
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate user
      description: 'Validates credentials. If MFA is required or enabled, returns partial token with mfaRequired: true. Otherwise issues access token and sets httpOnly refresh token cookie.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=abc...; Path=/api/v1/auth; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate refresh token
      description: Reads httpOnly refreshToken cookie. Rotates token family and issues new access token. Detects reuse of consumed tokens, instantly revoking entire family.
      security: []
      responses:
        '200':
          description: Token rotated successfully
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Terminate current session
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session terminated and cookie cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout-all:
    post:
      tags:
        - Auth
      summary: Terminate all sessions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All user sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/setup:
    post:
      tags:
        - Auth
      summary: Initialize TOTP MFA
      security:
        - BearerAuth: []
      responses:
        '200':
          description: MFA setup details with TOTP secret and QR URI
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      secret:
                        type: string
                      qrUri:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/verify:
    post:
      tags:
        - Auth
      summary: Verify TOTP code and complete authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: MFA verification successful, access token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/change-password:
    post:
      tags:
        - Auth
      summary: Change password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password updated and all other sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current authenticated user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/users:
    get:
      tags:
        - Users
      summary: List users
      x-required-permission: user.view
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Users
      summary: Create new user
      x-required-permission: user.create
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
      responses:
        '201':
          description: User created atomically with audit entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      x-required-permission: user.view
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
        - Users
      summary: Update user details
      x-required-permission: user.update
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '200':
          description: Updated user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/users/{id}/deactivate:
    post:
      tags:
        - Users
      summary: Deactivate user account
      x-required-permission: user.deactivate
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deactivated user record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/users/{id}/delegate:
    post:
      tags:
        - Users
      summary: Delegate user permissions temporarily
      x-required-permission: user.delegate
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegateInput'
      responses:
        '200':
          description: Delegated user record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/users/{id}/unlock:
    post:
      tags:
        - Users
      summary: Unlock user account after failed login lockout
      x-required-permission: user.unlock
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unlocked user record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/roles:
    get:
      tags:
        - Roles
      summary: List roles
      x-required-permission: role.view
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of roles
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Roles
      summary: Create custom role
      x-required-permission: role.create
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleInput'
      responses:
        '201':
          description: Role created atomically with audit entry
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/roles/{id}:
    get:
      tags:
        - Roles
      summary: Get role details
      x-required-permission: role.view
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Role details
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
        - Roles
      summary: Update custom role
      x-required-permission: role.update
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleInput'
      responses:
        '200':
          description: Role updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /audit-logs:
    get:
      tags:
        - Audit Logs
      summary: Query append-only audit trail
      x-required-permission: auditlog.view.full
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: entityType
          schema:
            type: string
        - in: query
          name: entityId
          schema:
            type: string
        - in: query
          name: actor
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated audit records
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /branches:
    get:
      tags:
        - Master Data - Branches
      summary: List branches
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Branch'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Master Data - Branches
      summary: Create Branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchInput'
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Branch'
        '400':
          description: Validation failed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /branches/{id}:
    get:
      tags:
        - Master Data - Branches
      summary: Get Branch by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Branch details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Branch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
    patch:
      tags:
        - Master Data - Branches
      summary: Update Branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchInput'
      responses:
        '200':
          description: Branch updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Branch'
        '400':
          description: Validation failed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
    delete:
      tags:
        - Master Data - Branches
      summary: Hard delete Branch (Blocked per FR-MD-05)
      description: Hard deletes are prohibited on master data entities per FR-MD-05. Always returns 405 Method Not Allowed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /branches/{id}/deactivate:
    post:
      tags:
        - Master Data - Branches
      summary: Deactivate Branch (Soft delete per FR-MD-05)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Branch deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Branch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
  /branches/{id}/history:
    get:
      tags:
        - Master Data - Branches
      summary: Get Branch change history (FR-MD-06)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Version and change history list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MasterDataHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /buildings:
