# AM-PMS CI pipeline skeleton
# See design doc Section 11.2 for the full intended pipeline
# (lint -> typecheck -> unit -> integration -> e2e -> build -> security scan).
# Steps are stubbed as workspace scripts land during Phase 1+.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install
      - run: npm run test

  # integration-tests, e2e, build, and security-scan jobs are added as their
  # respective phases (design doc Section 12.2) land real implementations.
